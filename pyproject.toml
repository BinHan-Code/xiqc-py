[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xiqc"
version = "0.1.0"
description = "Python library and CLI for the ExtremeCloud IQ Controller REST API"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "typer>=0.12",
]

[project.scripts]
xiqc = "xiqc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/xiqc/cli.py" = ["B008"]  # typer.Option() in defaults is the intended typer pattern

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live controller tests (requires XIQC_HOST env var)",
]
